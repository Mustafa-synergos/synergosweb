<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 105 606" width="105px" height="606px">
  <style>
    /* Base style for solid particles */
    .solid { fill: #E0E0E0; }
    
    /* Base style for the hollow ring particles */
    .hollow { fill: none; stroke: #E0E0E0; stroke-width: 1.5; }

    /* Dust blowing animation config - Strictly unchanged */
    @keyframes blowDust {
      0% {
        transform: translate(0, 0);
        opacity: 1;
      }
      50% {
        opacity: 0.8;
      }
      100% {
        transform: translate(var(--drift), 280px);
        opacity: 0;
      }
    }

    /* Staggered individual animation configurations - Strictly unchanged */
    .p1 { --drift: -20px; animation: blowDust 3.2s infinite ease-in 0.1s; }
    .p2 { --drift: 15px;  animation: blowDust 2.8s infinite ease-in 0.5s; }
    .p3 { --drift: -10px; animation: blowDust 3.5s infinite ease-in 0.2s; }
    .p4 { --drift: 25px;  animation: blowDust 3.0s infinite ease-in 0.7s; }
    .p5 { --drift: -35px; animation: blowDust 4.0s infinite ease-in 0.4s; }
    .p6 { --drift: 5px;   animation: blowDust 2.5s infinite ease-in 0.9s; }
    .p7 { --drift: -15px; animation: blowDust 3.7s infinite ease-in 0.3s; }
    .p8 { --drift: 30px;  animation: blowDust 3.1s infinite ease-in 0.6s; }
    .p9 { --drift: -25px; animation: blowDust 2.9s infinite ease-in 0.8s; }
    .p10 { --drift: 10px;  animation: blowDust 3.4s infinite ease-in 1.1s; }
    .p11 { --drift: -5px;  animation: blowDust 3.8s infinite ease-in 1.3s; }
    .p12 { --drift: 20px;  animation: blowDust 2.7s infinite ease-in 1.0s; }
    .p13 { --drift: -30px; animation: blowDust 3.3s infinite ease-in 1.5s; }
    .p14 { --drift: 40px;  animation: blowDust 3.6s infinite ease-in 1.2s; }
    .p15 { --drift: -18px; animation: blowDust 2.6s infinite ease-in 1.7s; }
    .p16 { --drift: 12px;  animation: blowDust 3.9s infinite ease-in 1.4s; }
  </style>
  
