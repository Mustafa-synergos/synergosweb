<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 506 88" width="506px" height="88px">
  <style>
    /* Base style for solid particles */
    .solid { fill: #E0E0E0; }
    
    /* Base style for the hollow ring particles */
    .hollow { fill: none; stroke: #E0E0E0; stroke-width: 1.5; }

    /* Dust blowing animation config - Right-to-Left translation scaled to fit 506px view */
    @keyframes blowDust {
      0% {
        transform: translate(0, 0);
        opacity: 1;
      }
      50% {
        opacity: 0.8;
      }
      100% {
        transform: translate(210px, var(--drift));
        opacity: 0;
      }
    }

    /* Staggered individual animation configurations - Strictly unchanged timings */
    .p1 { --drift: -16px; animation: blowDust 3.2s infinite ease-in 0.1s; }
    .p2 { --drift: 12px;  animation: blowDust 2.8s infinite ease-in 0.5s; }
    .p3 { --drift: -8px;  animation: blowDust 3.5s infinite ease-in 0.2s; }
    .p4 { --drift: 20px;  animation: blowDust 3.0s infinite ease-in 0.7s; }
    .p5 { --drift: -28px; animation: blowDust 4.0s infinite ease-in 0.4s; }
    .p6 { --drift: 4px;   animation: blowDust 2.5s infinite ease-in 0.9s; }
    .p7 { --drift: -12px; animation: blowDust 3.7s infinite ease-in 0.3s; }
    .p8 { --drift: 24px;  animation: blowDust 3.1s infinite ease-in 0.6s; }
    .p9 { --drift: -20px; animation: blowDust 2.9s infinite ease-in 0.8s; }
    .p10 { --drift: 8px;  animation: blowDust 3.4s infinite ease-in 1.1s; }
    .p11 { --drift: -4px;  animation: blowDust 3.8s infinite ease-in 1.3s; }
    .p12 { --drift: 16px;  animation: blowDust 2.7s infinite ease-in 1.0s; }
    .p13 { --drift: -24px; animation: blowDust 3.3s infinite ease-in 1.5s; }
    .p14 { --drift: 32px;  animation: blowDust 3.6s infinite ease-in 1.2s; }
    .p15 { --drift: -14px; animation: blowDust 2.6s infinite ease-in 1.7s; }
    .p16 { --drift: 10px;  animation: blowDust 3.9s infinite ease-in 1.4s; }
  </style>
  
